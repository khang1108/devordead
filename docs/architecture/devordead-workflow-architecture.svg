<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="devordead-workflow-architecture-title devordead-workflow-architecture-desc" id="devordead-workflow-architecture-root">
        <title id="devordead-workflow-architecture-title">DevOrDead Runtime Request and Delivery Workflow</title>
        <desc id="devordead-workflow-architecture-desc">Architecture workflow connecting the frontend React workbench and Vite proxy to the focal FastAPI gateway, JWT guard, isolated Python and Node sandbox, SQLite store, evaluation reports, and Playwright-verified pull request to main.</desc>
