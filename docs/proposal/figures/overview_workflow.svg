    <text x="122" y="60" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">1,2</tspan></text>
    <text x="172" y="60" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">1,3</tspan></text>

    <!-- Row 2 -->
    <text x="74" y="82" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">2,1</tspan></text>
    <text x="122" y="82" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">2,2</tspan></text>
    <text x="172" y="82" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">2,3</tspan></text>

    <!-- Row 3 -->
    <text x="74" y="104" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">3,1</tspan></text>
    <text x="122" y="104" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">3,2</tspan></text>
    <text x="172" y="104" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">3,3</tspan></text>

    <!-- Row 4 -->
    <text x="74" y="126" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">4,1</tspan></text>
    <text x="122" y="126" font-size="9.5px" text-anchor="middle"><tspan font-style="italic">c</tspan><tspan font-size="7.5px" dy="2">4,2</tspan></text>
