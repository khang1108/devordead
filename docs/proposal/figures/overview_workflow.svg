<svg class="p" viewBox="0 0 980 550" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .p text { font-family: "Liberation Serif", "Times New Roman", Cambria, Georgia, serif; fill: #1a1a1a; }
      .p .ttl { font-size: 13.5px; font-style: italic; font-weight: 700; }
      .p .pnl { font-size: 12px; font-style: italic; fill: #312e81; font-weight: 700; }
      .p .box { font-size: 11px; }
      .p .sub { font-size: 8.5px; fill: #4b5563; }
      .p .lbl { font-size: 9px; fill: #1f2937; }
