  <text class="box" x="78" y="83" text-anchor="middle" font-weight="bold" fill="#1e3a24">Candidate Input</text>
  <line x1="30" y1="89" x2="126" y2="89" stroke="#5f8a6b" stroke-width="0.6" stroke-dasharray="2 2"/>
