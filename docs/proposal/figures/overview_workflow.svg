  <text class="lbl" x="817" y="112">• Test Suite Correctness</text>
  <text class="lbl" x="817" y="130">• Memory / Runtime Log</text>
  <text class="lbl" x="817" y="148">• Baseline Scores E[k]</text>
  <line x1="812" y1="158" x2="946" y2="158" stroke="#4b5563" stroke-width="0.5" stroke-dasharray="2 2"/>
