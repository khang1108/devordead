  <text class="pnl" x="28" y="27">Phase 1: Career Context Ingestion, Knowledge Taxonomy &amp; Dual-Track Practice</text>
  <circle class="bg" cx="952" cy="23" r="8"/>
  <text class="bn" x="952" y="26" text-anchor="middle">1</text>

  <!-- Candidate Input -->
