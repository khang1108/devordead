      .p .bn { fill: #fff; font-size: 9px; font-weight: 700; font-family: "Liberation Sans", sans-serif; }
      .p path, .p line, .p rect, .p ellipse, .p polygon { vector-effect: non-scaling-stroke; }
      .p .w { fill: none; stroke: #2b2b2b; stroke-width: 1.1; marker-end: url(#mk); }
      .p .bus { fill: none; stroke: #2b2b2b; stroke-width: 1.1; }
      .p .r { fill: none; stroke: #8b1a1a; stroke-width: 1.2; marker-end: url(#mkr); }
      .p .b { fill: none; stroke: #0070c0; stroke-width: 1.2; marker-end: url(#mkb); }
      .p .d { stroke-dasharray: 4 3; }
    </style>
    <marker id="mk" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1.4 L7.4 4.5 L1 7.6 z" fill="#2b2b2b"/>
    </marker>
    <marker id="mkr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1.4 L7.4 4.5 L1 7.6 z" fill="#8b1a1a"/>
    </marker>
    <marker id="mkb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M1 1.4 L7.4 4.5 L1 7.6 z" fill="#0070c0"/>
    </marker>
  </defs>

  <!-- ============ PHASE 1: CONTEXT INGESTION & DUAL-TRACK PRACTICE ============ -->
