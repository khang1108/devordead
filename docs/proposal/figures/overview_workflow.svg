  <!-- TRACK A: Voice Knowledge Practice -->
  <rect x="465" y="38" width="145" height="74" rx="6" fill="#eaf0fb" stroke="#7f93b8" stroke-width="1.1"/>
  <text class="box" x="537" y="56" text-anchor="middle" font-weight="bold" fill="#1e3a6a">Voice Practice</text>
  <line x1="472" y1="62" x2="602" y2="62" stroke="#7f93b8" stroke-width="0.6" stroke-dasharray="2 2"/>
