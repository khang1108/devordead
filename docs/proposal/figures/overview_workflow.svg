  <text class="sub" x="78" y="118" text-anchor="middle">Optional CV / Resume</text>
  <text class="sub" x="78" y="132" text-anchor="middle">Target Job Descr. (JD)</text>
  <path class="w" d="M132,107 H152"/>

  <!-- Context Synthesizer & LLM Parser -->
